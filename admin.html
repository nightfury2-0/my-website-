<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Dispatch — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Tangerine:wght@700&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="frame">
    <section class="card">
      <p class="brand">Daily Dispatch</p>
      <p class="kicker">Admin</p>
      <div id="stage-signin">
        <h1>Sign in as an admin</h1>
        <p class="sub">Only people already on the admin list can view or change it.</p>
        <div class="rule"></div>
        <div id="signInDiv" class="signin-slot"></div>
        <p id="status" class="status" role="status"></p>
      </div>
      <div id="stage-panel" style="display:none;">
        <h1>Manage admins</h1>
        <p class="sub" id="signed-in-as"></p>
        <div class="rule"></div>
        <div id="admin-list"></div>
        <div class="rule"></div>
        <form id="add-form" style="display:flex; gap:8px; margin-bottom:8px;">
          <input class="field" id="new-email" type="email" placeholder="name@company.com" required style="flex:1;" />
          <button class="gold-btn" type="submit" style="width:auto; padding:12px 20px;">Add</button>
        </form>
        <p id="add-status" class="status" role="status"></p>
      </div>
      <a class="quiet-link" href="/">Back to sign-in</a>
    </section>
  </main>
  <script>
    let credential = null;

    async function init() {
      try {
        const res = await fetch('/config');
        if (!res.ok) throw new Error('Could not load server configuration.');
        const { googleClientId } = await res.json();
        if (!googleClientId) return setStatus('Server is missing GOOGLE_CLIENT_ID — check the environment.', true);
        if (!window.google?.accounts?.id) return setStatus('Google Sign-In failed to load. Refresh and try again.', true);
        google.accounts.id.initialize({ client_id: googleClientId, callback: handleCredentialResponse });
        google.accounts.id.renderButton(document.getElementById('signInDiv'), { theme:'outline', size:'large', shape:'pill', text:'continue_with', width:320 });
      } catch (error) {
        setStatus(error.message || 'Could not connect to the server.', true);
      }
    }

    function setStatus(text, isError) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.classList.toggle('status--error', Boolean(isError));
    }
    function setAddStatus(text, isError) {
      const el = document.getElementById('add-status');
      el.textContent = text;
      el.classList.toggle('status--error', Boolean(isError));
    }

    async function api(path, body) {
      const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      let data;
      try { data = await res.json(); } catch { throw new Error('Server returned an invalid response.'); }
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
      return data;
    }

    async function handleCredentialResponse(response) {
      setStatus('Checking admin access…');
      credential = response.credential;
      try {
        const data = await api('/api/admins/list', { credential });
        document.getElementById('stage-signin').style.display = 'none';
        document.getElementById('stage-panel').style.display = 'block';
        document.getElementById('signed-in-as').textContent = `Signed in as ${data.you}`;
        renderAdmins(data.admins);
      } catch (error) {
        credential = null;
        setStatus(error.message || 'Could not verify admin access.', true);
      }
    }

    function renderAdmins(admins) {
      const list = document.getElementById('admin-list');
      list.replaceChildren();
      admins.forEach((a) => {
        const row = document.createElement('div'); row.className = 'admin-row';
        const info = document.createElement('div');
        const email = document.createElement('p'); email.className = 'admin-email'; email.textContent = a.email;
        const meta = document.createElement('p'); meta.className = 'admin-meta';
        meta.textContent = `added ${new Date(a.addedAt).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'})}`;
        info.append(email, meta);
        const btn = document.createElement('button'); btn.className = 'remove-btn'; btn.textContent = 'Remove';
        btn.addEventListener('click', () => removeAdmin(a.email));
        row.append(info, btn); list.appendChild(row);
      });
    }

    async function removeAdmin(email) {
      setAddStatus('Removing…');
      try { const data = await api('/api/admins/remove', { credential, email }); renderAdmins(data.admins); setAddStatus('Admin removed.'); }
      catch (error) { setAddStatus(error.message || 'Could not remove that admin.', true); }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailField = document.getElementById('new-email');
      const email = emailField.value.trim();
      if (!email) return setAddStatus('Enter an email address first.', true);
      setAddStatus('Adding…');
      try {
        const data = await api('/api/admins/add', { credential, email });
        emailField.value = ''; renderAdmins(data.admins); setAddStatus(`${email} can now sign in here as an admin.`);
      } catch (error) { setAddStatus(error.message || 'Could not add that admin.', true); }
    });

    init();
  </script>
</body>
</html>
